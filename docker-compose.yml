version: '3.8'

services:
  app:
    build: .
    ports:
      - "5001:8080"
    environment:
      - DATABASE_URL=postgresql://mantra:mantra_password@db:5432/mantradb?sslmode=disable
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: mantra
      POSTGRES_PASSWORD: mantra_password
      POSTGRES_DB: mantradb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
